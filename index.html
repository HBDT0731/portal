    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Great+Vibes&display=swap"

<body>

    <!-- =========================================
         PANTALLA DE ACCESO
         ========================================= -->

    <div class="contenedor" id="acceso">

        <h1>El arte de observar</h1>

        <p class="mensaje">
            Hay momentos que solo pueden ser descubiertos por quien conoce la clave.
        </p>

        <input
            type="password"
            id="codigo"
            placeholder="Ingresa el código"
            autocomplete="off">

        <button id="verificar">
            Continuar
        </button>

        <p id="error" class="error"></p>

    </div>


    <!-- =========================================
         ACCESO CONCEDIDO
         ========================================= -->

    <div
        class="contenedor"
        id="contenido"
        style="display:none;">

        <h1>El arte de observar</h1>

        <p class="mensaje">
            Elige qué quieres recordar.
        </p>

        <button id="continuar">
            Entrar
        </button>

    </div>

         CONTROL DE ACCESO
         ========================================= -->
