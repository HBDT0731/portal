<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>

    <style>
        body{
            margin:0;
            background:#0f0f0f;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
        }

        .box{
            max-width:500px;
            padding:40px;
        }

        h1{
            font-size:32px;
            margin-bottom:20px;
        }

        p{
            color:#cfcfcf;
            font-size:18px;
            line-height:1.7;
        }

        .btn{
            display:inline-block;
            margin-top:35px;
            padding:15px 35px;
            background:white;
            color:black;
            border-radius:40px;
            text-decoration:none;
            font-weight:bold;
        }

        .lock{
            font-size:60px;
        }
    </style>

</head>

<body>

<div class="box">

<div class="lock">🔒</div>

<h1>Contenido no disponible</h1>

<p>
Si recibiste este código QR,
escríbeme para activarlo.
</p>

<a class="btn" href="#">
Escribirme
</a>

</div>

</body>
</html>
